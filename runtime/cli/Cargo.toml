[package]
name = "noodle"
version = "1.0.0"
edition = "2021"
description = "Noodle runtime CLI: check, build, run, shot"

[[bin]]
name = "noodle"
path = "src/main.rs"

[dependencies]
noodle-core = { path = "../core" }
serde_json = "1"
minifb = { version = "0.27", optional = true }
png = "0.17"
miniz_oxide = "0.8"

[features]
default = ["window"]
window = ["dep:minifb"]
