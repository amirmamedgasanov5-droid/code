[package]
name = "noodle-core"
version = "1.0.0"
edition = "2021"
description = "Noodle runtime: Noodle Script + Noodle UI compiler, VM and native UI renderer"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
fontdue = "0.9"
